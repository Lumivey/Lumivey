name: v0 build safety

on:
  pull_request:
    paths:
      - '.github/workflows/v0-build-safety.yml'
      - 'app/api/**'
      - 'docs/architecture/sql/007_guest_resume_function_review.sql'
      - 'docs/architecture/sql/008_guest_correction_function_review.sql'
      - 'lib/lumivey/source-trust.ts'
      - 'lib/lumivey/discovery-correction-journal.ts'
      - 'lib/lumivey/discovery-claim-projection.ts'
      - 'lib/lumivey/guest-discovery-core.ts'
      - 'lib/lumivey/guest-dossier-access.ts'
      - 'lib/lumivey/guest-dossier-db-preflight.ts'
      - 'lib/lumivey/v0-build-identity.ts'
      - 'lib/lumivey/v0-build-gate.ts'
      - 'lib/lumivey/v0-build-authorization.ts'
      - 'lib/lumivey/v0-session-membership.ts'
      - 'lib/lumivey/v0-preview-approval.ts'
      - 'lib/lumivey/neon-preview-identity.ts'
      - 'lib/lumivey/neon-preview-identity-core.ts'
      - 'tests/guest-db-function-review.test.mjs'
      - 'tests/source-trust.test.mjs'
      - 'tests/discovery-correction-journal.test.mjs'
      - 'tests/discovery-claim-projection.test.mjs'
      - 'tests/guest-discovery-core.test.mjs'
      - 'tests/guest-dossier-access.test.mjs'
      - 'tests/guest-dossier-db-preflight.test.mjs'
      - 'tests/v0-build-identity.test.mjs'
      - 'tests/v0-build-gate.test.mjs'
      - 'tests/v0-build-authorization.test.mjs'
      - 'tests/v0-session-membership.test.mjs'
      - 'tests/v0-preview-approval.test.mjs'
      - 'tests/v0-paid-route-closed.test.mjs'
      - 'tests/v0-route-inventory.test.mjs'
      - 'tests/neon-preview-identity.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Review-only SQL, guest access, correction replay and v0 shutdown tests (no DB, secrets or paid APIs)
        run: node --experimental-strip-types --test tests/guest-db-function-review.test.mjs tests/guest-dossier-access.test.mjs tests/guest-dossier-db-preflight.test.mjs tests/source-trust.test.mjs tests/discovery-correction-journal.test.mjs tests/discovery-claim-projection.test.mjs tests/guest-discovery-core.test.mjs tests/v0-build-identity.test.mjs tests/v0-session-membership.test.mjs tests/v0-preview-approval.test.mjs tests/v0-build-authorization.test.mjs tests/v0-build-gate.test.mjs tests/v0-paid-route-closed.test.mjs tests/v0-route-inventory.test.mjs tests/neon-preview-identity.test.mjs
