name: v0 build safety

on:
  pull_request:
    paths:
      - '.github/workflows/v0-build-safety.yml'
      - 'app/api/**'
      - 'lib/lumivey/guest-discovery-core.ts'
      - 'lib/lumivey/v0-build-identity.ts'
      - 'lib/lumivey/v0-build-gate.ts'
      - 'lib/lumivey/v0-build-authorization.ts'
      - 'lib/lumivey/v0-session-membership.ts'
      - 'lib/lumivey/v0-preview-approval.ts'
      - 'lib/lumivey/neon-preview-identity.ts'
      - 'lib/lumivey/neon-preview-identity-core.ts'
      - 'tests/guest-discovery-core.test.mjs'
      - 'tests/v0-build-identity.test.mjs'
      - 'tests/v0-build-gate.test.mjs'
      - 'tests/v0-build-authorization.test.mjs'
      - 'tests/v0-session-membership.test.mjs'
      - 'tests/v0-preview-approval.test.mjs'
      - 'tests/v0-paid-route-closed.test.mjs'
      - 'tests/v0-route-inventory.test.mjs'
      - 'tests/neon-preview-identity.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Guest resume, fingerprint, session membership, approval, one-shot and safety unit tests (no secrets, DB or v0 API)
        run: node --experimental-strip-types --test tests/guest-discovery-core.test.mjs tests/v0-build-identity.test.mjs tests/v0-session-membership.test.mjs tests/v0-preview-approval.test.mjs tests/v0-build-authorization.test.mjs tests/v0-build-gate.test.mjs tests/v0-paid-route-closed.test.mjs tests/v0-route-inventory.test.mjs tests/neon-preview-identity.test.mjs
